[project]
name = "dataset-face-filter"
version = "0.1.0"
description = "DDD & SOLID compliant dataset face filtering pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "face-recognition",
    "face_recognition_models",
    "tqdm",
    "opencv-python-headless",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_filter"]
