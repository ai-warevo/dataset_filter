services:
  dataset-filter:
    build:
      context: .
    container_name: dataset_face_filter
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${VOLUME_REF_HOST}:${APP_REF_CONTAINER}:ro
      - ${VOLUME_INPUT_HOST}:${APP_INPUT_CONTAINER}
    command: >
      --reference ${APP_REF_CONTAINER}
      --input-dir ${APP_INPUT_CONTAINER}
      --defect-mode ${APP_DEFECT_MODE}
      --match-mode ${APP_MATCH_MODE}
