services:
  dataset-filter:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dataset_face_filter
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./main.py:/app/main.py
      - ./src:/app/src
      - ./data/debug/:/app/data/debug/
      - ./data/reference:/app/data/reference
      - ./data/weights:/app/weights
      - /c/Users/axel/AppData/Local/Comfy-Desktop/ComfyUI-Shared/output/smlq_sfwDataset30:/app/data/input
      - /c/Users/axel/AppData/Local/Comfy-Desktop/ComfyUI-Shared/output/smlq_sfw1/smlq_sfw_00005.png:/app/data/reference_image.png
    command: >
      main.py --reference ${REFERENCE_IMAGE}
      --input-dir ${INPUT_DIR}
      --defect-mode ${APP_DEFECT_MODE}
      --match-mode ${APP_MATCH_MODE}

  yolo-gen:
    profiles:
      - manual
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yolo_generator
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./src:/app/src
      - /c/Users/axel/AppData/Local/Comfy-Desktop/ComfyUI-Shared/output/smlq_sfw:/app/data/smlq_sfw
      - ./data/assets:/app/data/assets
      - ./data/clean_faces:/app/data/clean_faces
      - ./data/debug/:/app/data/debug/
      - ./data/reference:/app/data/reference
      - ./data/synthetic_output:/app/data/synthetic_output
      - ./data/weights:/app/weights
    entrypoint: ["sh"]
    tty: true
    stdin_open: true
